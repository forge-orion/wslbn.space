name: lint-pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title check
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const types = 'build|ci|docs|feat|fix|perf|refactor|revert|style|test|chore|post|content';
            const re = new RegExp(`^(${types})(\\(.+\\))?(!)?: .+`);
            if (!re.test(title)) {
              core.setFailed(`PR title "${title}" is not a Conventional Commit. Use <type>(<scope>): <summary> — types: feat fix docs chore ci post content …`);
            }
