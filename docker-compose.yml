name: wslbn-space-blog

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: wslbn-space-blog:latest
    container_name: wslbn_blog
    restart: unless-stopped
    networks:
      - wslbn
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  wslbn:
    driver: bridge
